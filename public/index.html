<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Makes the page fit phone screens instead of showing a zoomed-out desktop page -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muscat Airspace</title>
    <meta name="description" content="Live aircraft over Muscat, Oman, from the OpenSky Network" />
    <meta name="theme-color" content="#0b0f14" />

    <!-- Fonts from Google Fonts. "preconnect" starts the connection early so they load faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <!--
      Leaflet (the map library) from a CDN. The "integrity" value is a fingerprint
      of the exact file: if the CDN ever sent a different (possibly tampered)
      file, the browser would refuse to use it.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <!-- Our styles come after Leaflet's, so ours win when both set the same thing -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="map" role="region" aria-label="Map of aircraft over Muscat"></div>

    <!-- Our own zoom buttons (Leaflet's default ones are hidden). Real <button>s
         work with the keyboard automatically (Tab, then Enter or Space). -->
    <div class="zoom-controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <!-- Altitude colour key. Each dot gets its colour from the same .alt-*
         classes the planes use, so the key always matches the map. -->
    <aside class="legend" aria-label="Altitude colour key">
      <h2 class="legend-title">Altitude</h2>
      <ul class="legend-list">
        <li class="alt-high"><span class="legend-dot"></span>Above 25,000 ft</li>
        <li class="alt-mid"><span class="legend-dot"></span>10,000–25,000 ft</li>
        <li class="alt-low"><span class="legend-dot"></span>Below 10,000 ft</li>
        <li class="alt-ground"><span class="legend-dot"></span>On ground</li>
      </ul>
      <p class="legend-note">Faded: no position for 1+ min</p>
    </aside>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <!-- type="module" lets our files use import/export, the same syntax as the server -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
